aid: powerpoint
name: PowerPoint
description: >-
  Microsoft PowerPoint provides programmatic access through the Microsoft
  Graph API and the Office JavaScript API for creating, reading, and
  manipulating PowerPoint presentations. PowerPoint files stored in
  OneDrive and SharePoint are accessible as drive items via Microsoft
  Graph, while the Office JavaScript API enables in-document automation
  for Office Add-ins.
