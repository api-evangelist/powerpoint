    url: https://learn.microsoft.com/en-us/graph/auth/
- aid: powerpoint:powerpoint-javascript-api
  name: Office JavaScript API for PowerPoint
  description: >-
    Office JavaScript API namespace for building PowerPoint Add-ins that read, write, and manipulate slides,
    shapes, text, and tables inside the running PowerPoint application.
  humanURL: https://learn.microsoft.com/en-us/javascript/api/powerpoint
