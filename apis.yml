apis:
- aid: powerpoint:powerpoint-graph-api
  name: PowerPoint via Microsoft Graph
  description: >-
    Microsoft Graph exposes PowerPoint presentation files (.pptx) stored in OneDrive and SharePoint as
    drive items, enabling upload, download, sharing, and metadata operations against presentations programmatically.
  humanURL: https://learn.microsoft.com/en-us/graph/api/resources/driveitem
  baseURL: https://graph.microsoft.com/v1.0
